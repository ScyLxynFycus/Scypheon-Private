name: Scypheon Production Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests & Jacoco Coverage
      run: ./gradlew :scypheon_sdk:jacocoTestReport

    - name: Enforce @SafetyCritical Coverage Gates
      run: ./gradlew :scypheon_sdk:checkCoverage

    - name: Build Release Bundle
      run: ./gradlew :app:bundleRelease

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: scypheon-production-bundle
        path: app/build/outputs/bundle/release/*.aab
