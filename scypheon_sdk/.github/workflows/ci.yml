name: Enterprise CI/CD
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17', cache: 'gradle' }
      
      - name: Gradle Wrapper Validation
        uses: gradle/wrapper-validation-action@v2
      
      - name: Dependency Vulnerability Scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'scypheon'
          path: '.'
          format: 'HTML'
          out: 'reports'
          failOnCVSS: '7'

      - name: Unit Tests & Coverage Gates
        run: ./gradlew :scypheon_sdk:testDebugUnitTest :scypheon_sdk:jacocoTestReport :scypheon_sdk:checkCoverage --no-configuration-cache

      - name: Lint & KtLint
        run: ./gradlew lint ktlintCheck

      - name: SBOM Generation
        run: ./gradlew cyclonedxBom
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: '**/bom.json' }

      - name: Build Release AAB & R8 Verify
        run: ./gradlew :scypheon_sdk:assembleRelease

  instrumentation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [29, 33, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17', cache: 'gradle' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          script: ./gradlew :scypheon_sdk:connectedDebugAndroidTest --no-configuration-cache
